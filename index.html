<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f3f1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Clyra · Data language platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>
      <div class="sidebar-scrim" data-action="close-sidebar"></div>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="page" id="page" tabindex="-1"></main>
      </div>
    </div>

    <div id="overlay-root"></div>
    <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept=".csv,.json,.xlsx,.xls,.tsv,.parquet" multiple hidden />

    <script src="./app.js"></script>
  </body>
</html>
